name: CI/CD — Portfolio Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DEPLOY_DIR: /var/www/portfolio

jobs:
  # ═══════════════════════════════════════════════════
  # Job 1: Validate HTML & CSS
  # ═══════════════════════════════════════════════════
  validate:
    name: Validate HTML & CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7
        with:
          root: .
          css: true
          format: json

      - name: Check file structure
        run: |
          echo "=== Checking required files ==="
          test -f index.html && echo "OK: index.html" || (echo "MISSING: index.html" && exit 1)
          test -f side-projects.html && echo "OK: side-projects.html" || (echo "MISSING: side-projects.html" && exit 1)
          test -f assets/css/portfolio.css && echo "OK: portfolio.css" || (echo "MISSING: portfolio.css" && exit 1)
          test -f .gitignore && echo "OK: .gitignore" || (echo "MISSING: .gitignore" && exit 1)
          echo ""
          echo "=== Project structure ==="
          find . -not -path './.git/*' -not -path './.git' -not -path './.github/*' -not -path './.vscode/*' | sort

  # ═══════════════════════════════════════════════════
  # Job 2: Deploy to VPS via SSH
  # ═══════════════════════════════════════════════════
  deploy:
    name: Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host ${{ secrets.VPS_HOST }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 60
            ServerAliveCountMax 10
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -e

          echo "=== Portfolio Deploy ==="
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Host:   ${VPS_HOST}"
          echo "Date:   $(date)"
          echo ""

          # Create deploy directory if needed
          ssh "${VPS_USER}@${VPS_HOST}" "sudo mkdir -p ${DEPLOY_DIR} && sudo chown ${VPS_USER}:${VPS_USER} ${DEPLOY_DIR}"

          # Sync files via rsync
          echo "[1/3] Syncing files to VPS..."
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='.gitignore' \
            --exclude='deploy.sh' \
            --exclude='nginx.conf' \
            --exclude='README.md' \
            ./ "${VPS_USER}@${VPS_HOST}:${DEPLOY_DIR}/"

          # Set permissions
          echo "[2/3] Setting permissions..."
          ssh "${VPS_USER}@${VPS_HOST}" "chmod -R 755 ${DEPLOY_DIR}"

          # Reload nginx
          echo "[3/3] Reloading Nginx..."
          ssh "${VPS_USER}@${VPS_HOST}" "sudo nginx -t && sudo systemctl reload nginx"

          echo ""
          echo "=== Deploy complete ==="
          echo "Site: https://${{ secrets.VPS_DOMAIN }}"

  # ═══════════════════════════════════════════════════
  # Job 3: Deploy via Cloudflare Tunnel (alternative)
  # ═══════════════════════════════════════════════════
  deploy-cloudflare:
    name: Deploy via Cloudflare Tunnel
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    # Only use this if VPS has no fixed IP and uses Cloudflare Tunnel for SSH

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Deploy via Cloudflare Tunnel
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -e

          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat > ~/.ssh/config <<EOF
          Host ${VPS_HOST}
            ProxyCommand cloudflared access ssh --hostname %h \
              --service-token-id ${CF_ACCESS_CLIENT_ID} \
              --service-token-secret ${CF_ACCESS_CLIENT_SECRET}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 60
            ServerAliveCountMax 10
          EOF
          chmod 600 ~/.ssh/config

          echo "=== Portfolio Deploy (Cloudflare Tunnel) ==="

          # Create deploy directory
          ssh "${VPS_USER}@${VPS_HOST}" "sudo mkdir -p ${DEPLOY_DIR} && sudo chown ${VPS_USER}:${VPS_USER} ${DEPLOY_DIR}"

          # Sync files
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ProxyCommand='cloudflared access ssh --hostname %h --service-token-id ${CF_ACCESS_CLIENT_ID} --service-token-secret ${CF_ACCESS_CLIENT_SECRET}'" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='.gitignore' \
            --exclude='deploy.sh' \
            --exclude='nginx.conf' \
            --exclude='README.md' \
            ./ "${VPS_USER}@${VPS_HOST}:${DEPLOY_DIR}/"

          ssh "${VPS_USER}@${VPS_HOST}" "chmod -R 755 ${DEPLOY_DIR} && sudo nginx -t && sudo systemctl reload nginx"

          echo "=== Deploy complete ==="
