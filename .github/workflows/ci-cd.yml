name: CI/CD — Portfolio Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ═══════════════════════════════════════════════════
  # Job 1: Validate
  # ═══════════════════════════════════════════════════
  validate:
    name: Validate HTML & CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML5
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate HTML files
        run: |
          echo "=== Validating index.html ==="
          html-validate index.html
          echo ""
          echo "=== Validating side-projects.html ==="
          html-validate side-projects.html
          echo ""
          echo "=== Validation passed ==="

      - name: Check project structure
        run: |
          echo "=== Checking required files ==="
          test -f index.html && echo "OK: index.html" || (echo "MISSING: index.html" && exit 1)
          test -f side-projects.html && echo "OK: side-projects.html" || (echo "MISSING: side-projects.html" && exit 1)
          test -f assets/css/portfolio.css && echo "OK: portfolio.css" || (echo "MISSING: portfolio.css" && exit 1)
          test -f .gitignore && echo "OK: .gitignore" || (echo "MISSING: .gitignore" && exit 1)
          echo ""
          echo "=== Project structure ==="
          find . -not -path './.git/*' -not -path './.git' -not -path './.github/*' -not -path './.vscode/*' -not -path './node_modules/*' | sort

  # ═══════════════════════════════════════════════════
  # Job 2: Deploy to VPS via SSH
  # ═══════════════════════════════════════════════════
  deploy:
    name: Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host ${{ secrets.VPS_HOST }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 60
            ServerAliveCountMax 10
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -e

          echo "=== Portfolio Deploy ==="
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Host:   ${VPS_HOST}"
          echo "Date:   $(date)"
          echo ""

          # Create deploy directory if needed
          ssh "${VPS_USER}@${VPS_HOST}" "sudo mkdir -p /var/www/portfolio && sudo chown ${VPS_USER}:${VPS_USER} /var/www/portfolio"

          # Sync files via rsync
          echo "[1/3] Syncing files to VPS..."
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='.gitignore' \
            --exclude='deploy.sh' \
            --exclude='nginx.conf' \
            --exclude='README.md' \
            --exclude='node_modules' \
            ./ "${VPS_USER}@${VPS_HOST}:/var/www/portfolio/"

          # Set permissions
          echo "[2/3] Setting permissions..."
          ssh "${VPS_USER}@${VPS_HOST}" "chmod -R 755 /var/www/portfolio"

          # Reload nginx
          echo "[3/3] Reloading Nginx..."
          ssh "${VPS_USER}@${VPS_HOST}" "sudo nginx -t && sudo systemctl reload nginx"

          echo ""
          echo "=== Deploy complete ==="
