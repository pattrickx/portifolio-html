name: CI/CD — Portfolio Deploy

on:
  push:
    branches: [main, master]
  pull_request:

    branches: [main, master]

jobs:
  # ═══════════════════════════════════════════════════
  # Job 1: Validate
  # ═══════════════════════════════════════════════════
  validate:
    name: Validate HTML & CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate HTML files
        run: |
          echo "=== Validating index.html ==="
          html-validate index.html
          echo ""
          echo "=== Validating side-projects.html ==="
          html-validate side-projects.html
          echo ""
          echo "=== All validations passed ==="

      - name: Check project structure
        run: |
          test -f index.html && echo "OK: index.html" || (echo "MISSING" && exit 1)
          test -f side-projects.html && echo "OK: side-projects.html" || (echo "MISSING" && exit 1)
          test -f assets/css/portfolio.css && echo "OK: portfolio.css" || (echo "MISSING" && exit 1)
          test -f .gitignore && echo "OK: .gitignore" || (echo "MISSING" && exit 1)
          echo "OK: all checks passed"

  # ═══════════════════════════════════════════════════
  # Job 2: Deploy to VPS via SSH
  # ═══════════════════════════════════════════════════
  deploy:
    name: Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH and deploy
        env:
          VPS_HOST_RAW: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e

          # Normalize host: strip protocol prefixes and trailing slashes
          HOST="$VPS_HOST_RAW"
          HOST="${HOST#tcp://}"
          HOST="${HOST#https://}"
          HOST="${HOST#http://}"
          HOST="${HOST%%/}"

          echo "=== Portfolio Deploy ==="
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Host:   $HOST"
          echo "User:   $VPS_USER"
          echo "Date:   $(date)"
          echo ""

          # Write SSH key
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Write SSH config
          cat > ~/.ssh/config <<SSHEOF
          Host portfolio-vps
            HostName $HOST
            User $VPS_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 60
            ServerAliveCountMax 10
          SSHEOF
          chmod 600 ~/.ssh/config

          # Create deploy dir if needed
          echo "[1/3] Preparing VPS..."
          ssh portfolio-vps "sudo mkdir -p /var/www/portfolio && sudo chown \$(whoami):\$(whoami) /var/www/portfolio"

          # Sync files
          echo "[2/3] Syncing files..."
          rsync -avz --delete \
            -e "ssh -F ~/.ssh/config" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='.gitignore' \
            --exclude='deploy.sh' \
            --exclude='nginx.conf' \
            --exclude='README.md' \
            --exclude='node_modules' \
            ./ "portfolio-vps:/var/www/portfolio/"

          # Reload nginx
          echo "[3/3] Reloading nginx..."
          ssh portfolio-vps "chmod -R 755 /var/www/portfolio && sudo nginx -t && sudo systemctl reload nginx" || true

          echo ""
          echo "=== Deploy complete ==="
