name: CI/CD — Portfolio Deploy

on:
  push:
    branches: [main, master]
  pull_request:

    branches: [main, master]

jobs:
  # ═══════════════════════════════════════════════════
  # Job 1: Validate
  # ═══════════════════════════════════════════════════
  validate:
    name: Validate HTML & CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate HTML files
        run: |
          echo "=== Validating index.html ==="
          html-validate index.html
          echo ""
          echo "=== Validating side-projects.html ==="
          html-validate side-projects.html
          echo ""
          echo "=== All validations passed ==="

      - name: Check project structure
        run: |
          echo "=== Required files ==="
          test -f index.html && echo "OK: index.html" || (echo "MISSING: index.html" && exit 1)
          test -f side-projects.html && echo "OK: side-projects.html" || (echo "MISSING: side-projects.html" && exit 1)
          test -f assets/css/portfolio.css && echo "OK: portfolio.css" || (echo "MISSING: portfolio.css" && exit 1)
          test -f .gitignore && echo "OK: .gitignore" || (echo "MISSING: .gitignore" && exit 1)
          echo ""
          echo "OK: all checks passed"

  # ═══════════════════════════════════════════════════
  # Job 2: Deploy to VPS
  # ═══════════════════════════════════════════════════
  deploy:
    name: Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: .env

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            DEPLOY_DIR="/var/www/portfolio"

            echo "=== Portfolio Deploy ==="
            echo "Branch: ${{ github.ref_name }}"
            echo "Commit: ${{ github.sha }}"
            echo "Host:   $(hostname)"
            echo "Date:   $(date)"

            if [ ! -d "$DEPLOY_DIR" ]; then
              sudo mkdir -p "$DEPLOY_DIR"
              sudo chown $(whoami):$(whoami) "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
              git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .
            fi

            cd "$DEPLOY_DIR"
            git fetch origin
            git checkout "${{ github.ref_name }}"
            git pull origin "${{ github.ref_name }}"

            chmod -R 755 .

            if command -v nginx &> /dev/null; then
              sudo nginx -t && sudo systemctl reload nginx
            fi

            echo "=== Deploy complete ==="
