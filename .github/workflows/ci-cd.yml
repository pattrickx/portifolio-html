name: CI/CD — Portfolio Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ═══════════════════════════════════════════════════
  # Job 1: Validate
  # ═══════════════════════════════════════════════════
  validate:
    name: Validate HTML & CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate HTML files
        run: |
          echo "=== Validating index.html ==="
          html-validate index.html
          echo ""
          echo "=== Validating side-projects.html ==="
          html-validate side-projects.html
          echo ""
          echo "=== All validations passed ==="

  # ═══════════════════════════════════════════════════
  # Job 2: Deploy to VPS via SSH
  # ═══════════════════════════════════════════════════
  deploy:
    name: Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH and deploy
        env:
          VPS_HOST_RAW: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e

          # Normalize host
          HOST="$VPS_HOST_RAW"
          # Remove protocol prefix
          if [[ "$HOST" == *://* ]]; then
            HOST="${HOST##*://}"
          fi
          # Remove trailing slashes one by one
          while [[ "$HOST" == */ ]]; do
            HOST="${HOST%/}"
          done

          echo "=== Portfolio Deploy ==="
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Host:   [$HOST]"
          echo "User:   $VPS_USER"
          echo "Date:   $(date)"
          echo ""

          # Write SSH key
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Write SSH config
          cat > ~/.ssh/config <<SSHEOF
          Host portfolio-vps
            HostName $HOST
            User $VPS_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 60
            ServerAliveCountMax 10
          SSHEOF
          chmod 600 ~/.ssh/config

          # Create deploy dir
          echo "[1/3] Preparing VPS..."
          ssh portfolio-vps "sudo mkdir -p /var/www/portfolio && sudo chown \$(whoami):\$(whoami) /var/www/portfolio"

          # Clone or update repo
          echo "[2/3] Deploying code..."
          ssh portfolio-vps "if [ ! -d /var/www/portfolio/.git ]; then cd /var/www/portfolio && git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git .; fi && cd /var/www/portfolio && git fetch origin && git checkout ${GITHUB_REF_NAME} && git pull origin ${GITHUB_REF_NAME} && chmod -R 755 ."

          # Reload nginx
          echo "[3/3] Reloading nginx..."
          ssh portfolio-vps "command -v nginx &> /dev/null && sudo nginx -t && sudo systemctl reload nginx || true"

          echo ""
          echo "=== Deploy complete ==="
