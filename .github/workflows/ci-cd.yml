name: CI/CD — Portfolio to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════
  # Job 1: Validate
  # ═══════════════════════════════════════════════════
  validate:
    name: Validate HTML & CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate HTML files
        run: |
          echo "=== Validating index.html ==="
          html-validate index.html
          echo ""
          echo "=== Validating side-projects.html ==="
          html-validate side-projects.html
          echo ""
          echo "=== All validations passed ==="

  # ═══════════════════════════════════════════════════
  # Job 2: Build & Deploy to GitHub Pages
  # ═══════════════════════════════════════════════════
  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          echo "=== Preparing site for GitHub Pages ==="
          mkdir -p _site
          cp index.html side-projects.html _site/
          mkdir -p _site/assets/css
          cp assets/css/portfolio.css _site/assets/css/
          mkdir -p _site/images
          cp -r images/* _site/images/
          mkdir -p _site/pdfs
          cp -r pdfs/* _site/pdfs/
          echo "=== Site ready ==="
          find _site -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
