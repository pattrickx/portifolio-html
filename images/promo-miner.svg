<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0f"/>
      <stop offset="100%" style="stop-color:#1e1e26"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg)"/>
  <!-- Navbar -->
  <rect x="0" y="0" width="600" height="48" fill="#141418" stroke="#2a2a35"/>
  <text x="20" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ff6b35">Promo</text>
  <text x="75" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e8e6f0">Finder</text>
  <text x="480" y="30" font-family="sans-serif" font-size="11" fill="#7a7890">Latest</text>
  <text x="520" y="30" font-family="sans-serif" font-size="11" fill="#7a7890">Deals</text>
  <text x="555" y="30" font-family="sans-serif" font-size="11" fill="#7a7890">Stats</text>
  <!-- Hero -->
  <text x="300" y="100" font-family="sans-serif" font-size="24" font-weight="bold" fill="#e8e6f0" text-anchor="middle">🔥 Best Deals</text>
  <text x="300" y="125" font-family="sans-serif" font-size="24" font-weight="bold" fill="#e8e6f0" text-anchor="middle">from Amazon Brazil</text>
  <text x="300" y="155" font-family="sans-serif" font-size="13" fill="#7a7890" text-anchor="middle">Encontre as melhores promoções da Amazon Brasil</text>
  <!-- Buttons -->
  <rect x="180" y="175" width="110" height="36" rx="8" fill="#ff6b35"/>
  <text x="235" y="198" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Browse Deals</text>
  <rect x="310" y="175" width="120" height="36" rx="8" fill="#1e1e26" stroke="#ff6b35"/>
  <text x="370" y="198" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ff6b35" text-anchor="middle">Telegram Groups</text>
  <!-- Stats -->
  <text x="150" y="250" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ff6b35" text-anchor="middle">1,247</text>
  <text x="150" y="270" font-family="sans-serif" font-size="11" fill="#7a7890" text-anchor="middle">Deals Found</text>
  <text x="300" y="250" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ff6b35" text-anchor="middle">R$ 45k</text>
  <text x="300" y="270" font-family="sans-serif" font-size="11" fill="#7a7890" text-anchor="middle">Total Savings</text>
  <text x="450" y="250" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ff6b35" text-anchor="middle">89%</text>
  <text x="450" y="270" font-family="sans-serif" font-size="11" fill="#7a7890" text-anchor="middle">Avg Discount</text>
  <!-- Footer -->
  <text x="300" y="320" font-family="sans-serif" font-size="11" fill="#7a7890" text-anchor="middle">🦐 ShrimpDev · 📝 Blog</text>
</svg>
